<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feedback — noname</title>
<meta name="description" content="Share feedback on noname and sbplus." />
<meta name="theme-color" content="#faf9f7" />
<link rel="icon" type="image/png" href="images/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="stylesheet" href="style.css?v=4" />
<style>
  .form { max-width: 560px; margin: 40px auto 0; display: grid; gap: 16px; }
  .field { display: grid; gap: 7px; }
  .field label { font-size: .82rem; font-weight: 500; color: var(--ink-2); }
  .field input, .field textarea, .field select {
    font-family: inherit; font-size: .95rem; color: var(--ink); background: var(--card);
    border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: .8rem .9rem; width: 100%;
  }
  .field textarea { min-height: 140px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--ink); }
  .form-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .form-note { color: var(--ink-3); font-size: .82rem; }
</style>
</head>
<body>
<div class="main-content">
  <section class="page container">
    <div class="page-head">
      <span class="eyebrow" data-i18n="footer_feedback">Feedback</span>
      <h1 class="page-title" data-i18n="feedback_title">Tell us what you think.</h1>
      <p class="page-lede" data-i18n="feedback_lede">What helped, what didn’t, what’s missing. Every note shapes what we build next.</p>
    </div>

    <form class="form" id="feedback-form">
      <div class="field">
        <label for="fb-type" data-i18n="feedback_type">This is about…</label>
        <select id="fb-type">
          <option data-i18n="feedback_type_idea">An idea or request</option>
          <option data-i18n="feedback_type_bug">Something broken</option>
          <option data-i18n="feedback_type_content">A subject or topic</option>
          <option data-i18n="feedback_type_other">Something else</option>
        </select>
      </div>
      <div class="field">
        <label for="fb-msg" data-i18n="feedback_msg">Your message</label>
        <textarea id="fb-msg" required placeholder="…"></textarea>
      </div>
      <div class="form-row">
        <span class="form-note" data-i18n="feedback_note">Opens your email app — nothing is sent automatically.</span>
        <button type="submit" class="btn btn-primary" data-i18n="feedback_send">Send feedback <i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </form>

    <p style="text-align:center;margin-top:24px;color:var(--ink-3);font-size:.85rem">
      <span data-i18n="feedback_or">Prefer chat?</span>
      <a class="btn-link" href="https://discord.gg/hQGbsEfH" target="_blank" rel="noopener" style="display:inline-flex">Discord <i class="fa-solid fa-arrow-right"></i></a>
    </p>
  </section>
</div>

<script>
  window.NONAME_PAGE = { context: 'page', active: 'feedback' };
  var FEEDBACK_EMAIL = 'shining3366dev@gmail.com';
  document.getElementById('feedback-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var type = document.getElementById('fb-type').value;
    var msg = document.getElementById('fb-msg').value;
    var subject = encodeURIComponent('[noname feedback] ' + type);
    var body = encodeURIComponent(msg + '\n\n— sent from noname');
    window.location.href = 'mailto:' + FEEDBACK_EMAIL + '?subject=' + subject + '&body=' + body;
  });
</script>
<script src="./core/config.js"></script>
<script src="./layout.js"></script>
<script type="module" src="./auth.js"></script>
</body>
</html>
