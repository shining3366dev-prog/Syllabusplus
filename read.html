<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Cookiebot CMP — first script in <head>; auto-blocks cookies until consent -->
    <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="feea23ea-9c25-4e45-8655-2b4a5e7448c2" data-blockingmode="auto" type="text/javascript"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Read — noname</title>
    <meta name="description" content="Read: a small library of books and topics, one chapter at a time — with modern translations, vocabulary and quizzes. Part of the noname ecosystem.">
    <meta name="theme-color" content="#faf9f7">

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <div class="main-content">
        <section class="hero">
            <div class="hero-content">
                <h1 data-i18n="read_title">A library, one chapter at a time.</h1>
                <p data-i18n="read_lede">Pick a book, open a chapter — original passages, plain-English translations, vocabulary and quizzes.</p>
                <div class="read-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input id="book-search" type="search" placeholder="Search by title, author or tag…" autocomplete="off">
                </div>
            </div>
        </section>

        <section class="container" id="library">
            <div class="section-header">
                <h2 class="section-title" id="library-title" data-i18n="read_library">Library</h2>
            </div>
            <div class="course-grid" id="book-grid">
                <p data-i18n="read_loading">Loading books...</p>
            </div>
        </section>
    </div>

    <script>window.NONAME_PAGE = { context: 'read', active: 'read' };</script>

    <!-- Ecosystem core: must load before app scripts -->
    <script src="./core/config.js"></script>
    <script src="./layout.js"></script>
    <script src="./read.js"></script>
    <script type="module" src="./auth.js"></script>
</body>
</html>
